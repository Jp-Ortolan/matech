<text x="52" y="1217" font-size="11.5" fill="#5a6360">Administrativo e Administrador passam também nas operações de negócio</text>
<text x="52" y="1233" font-size="11.5" fill="#5a6360">acima: o permitir() do servidor acrescenta os dois à lista de autorizados</text>
<text x="52" y="1249" font-size="11.5" fill="#5a6360">de toda rota. A administração de contas é a única operação em que isso</text>
<text x="52" y="1265" font-size="11.5" fill="#5a6360">não vale — ela usa apenas(&#39;ADMINISTRADOR&#39;), sem acréscimo automático.</text>
<path d="M 630 1195 H 1146 L 1160 1209 V 1287 H 630 Z" fill="#f5f6f5" stroke="#8b938f" stroke-width="1"/>
<path d="M 1146 1195 V 1209 H 1160" fill="none" stroke="#8b938f" stroke-width="1"/>
<text x="642" y="1217" font-size="11.5" fill="#5a6360">Os casos marcados como app móvel são executados no aplicativo Flutter,</text>
<text x="642" y="1233" font-size="11.5" fill="#5a6360">sem conexão. Ficam gravados no SQLite do aparelho e sobem depois, pela</text>
<text x="642" y="1249" font-size="11.5" fill="#5a6360">rota de sincronização, com idempotência garantida pelo clientId.</text>
<text x="642" y="1265" font-size="11.5" fill="#5a6360">Os demais são executados no cliente web.</text>
