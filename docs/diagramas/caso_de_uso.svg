<text x="52" y="1342" font-size="11.5" fill="#5a6360">Administrativo e Administrador passam também nas operações de negócio</text>
<text x="52" y="1358" font-size="11.5" fill="#5a6360">acima: o permitir() do servidor acrescenta os dois à lista de autorizados</text>
<text x="52" y="1374" font-size="11.5" fill="#5a6360">de toda rota. A administração de contas é a única operação em que isso</text>
<text x="52" y="1390" font-size="11.5" fill="#5a6360">não vale — ela usa apenas(&#39;ADMINISTRADOR&#39;), sem acréscimo automático.</text>
<path d="M 630 1320 H 1146 L 1160 1334 V 1412 H 630 Z" fill="#f5f6f5" stroke="#8b938f" stroke-width="1"/>
<path d="M 1146 1320 V 1334 H 1160" fill="none" stroke="#8b938f" stroke-width="1"/>
<text x="642" y="1342" font-size="11.5" fill="#5a6360">Os casos marcados como app móvel são executados no aplicativo Flutter,</text>
<text x="642" y="1358" font-size="11.5" fill="#5a6360">sem conexão. Ficam gravados no SQLite do aparelho e sobem depois, pela</text>
<text x="642" y="1374" font-size="11.5" fill="#5a6360">rota de sincronização, com idempotência garantida pelo clientId.</text>
<text x="642" y="1390" font-size="11.5" fill="#5a6360">Os demais são executados no cliente web.</text>
</svg>